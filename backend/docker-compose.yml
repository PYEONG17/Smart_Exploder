services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-explorer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_explorer
      POSTGRES_USER: smart_explorer
      POSTGRES_PASSWORD: smart_explorer_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - smart_explorer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_explorer -d smart_explorer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smart_explorer_postgres_data:
